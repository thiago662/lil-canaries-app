<header class="topo">
  <a routerLink="/" class="marca">
    <app-mascote class="logo" [rosto]="true" /> Canarinhos Pistola
  </a>
  @if (auth.perfil(); as p) {
    <nav class="nav" aria-label="Principal">
      <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
        <span aria-hidden="true">🏆</span> Placar
      </a>
      <a routerLink="/apelidos" routerLinkActive="ativo">
        <span aria-hidden="true">Ⓜ️</span> Apelidos
      </a>
      <a [routerLink]="['/canarinho', auth.usuario()?.uid]" routerLinkActive="ativo">
        <span aria-hidden="true">{{ p.avatar }}</span> Minha ficha
      </a>
    </nav>
    <button class="sair" (click)="sair()">Sair</button>
  }
</header>
<main class="conteudo">
  <router-outlet />
</main>
